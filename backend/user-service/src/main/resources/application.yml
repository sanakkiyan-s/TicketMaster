server:
  port: 8082

spring:
  application:
    name: user-service

  datasource:
    # Same coordinator convention as auth-service: goes directly at
    # Postgres (:5433 on the host), not through PgBouncer. See
    # auth-service's application.yml for the full rationale.
    #
    # currentSchema=user_service - both services default to the SAME
    # DB_NAME (ticketmaster), which is fine (one Postgres coordinator
    # hosting every service's data is the deliberate early-phase setup),
    # but that only works if each service also gets its OWN schema
    # within it. Discovered live 2026-08-19 running both services
    # against the shared dev compose Postgres for the first time:
    # without this, user-service's V1 migration collides with
    # auth-service's own V1 in the same public.flyway_schema_history -
    # same version number, different checksum, Flyway refuses to start.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ticketmaster}
    username: ${DB_USER:ticketmaster}
    password: ${DB_PASSWORD:ticketmaster}

  jpa:
    hibernate:
      # Flyway owns the schema (ADR-027); Hibernate only validates against
      # it, never alters it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Pins Hibernate to the same schema Flyway migrates into
        # (below), independent of the connection's own search_path -
        # test config overrides spring.datasource.url directly to a
        # Testcontainers URL that carries no currentSchema param, so a
        # JDBC-URL-only approach silently broke schema validation
        # (Hibernate looked in "public", found nothing, since Flyway had
        # put everything in "user_service"). This property has no such
        # dependency on how the URL was built.
        default_schema: user_service

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Creates the user_service schema if it doesn't exist yet, and scopes
    # this service's OWN flyway_schema_history there - see the datasource
    # comment above for why this is load-bearing, not cosmetic.
    schemas: user_service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_UI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # ADR-032: liveness never dependency-aware, readiness may be.
      probes:
        enabled: true
      show-details: when-authorized
