server:
  port: 8082

spring:
  application:
    name: user-service

  datasource:
    # Same coordinator convention as auth-service: goes directly at
    # Postgres (:5433 on the host), not through PgBouncer. See
    # auth-service's application.yml for the full rationale.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ticketmaster}
    username: ${DB_USER:ticketmaster}
    password: ${DB_PASSWORD:ticketmaster}

  jpa:
    hibernate:
      # Flyway owns the schema (ADR-027); Hibernate only validates against
      # it, never alters it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_UI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # ADR-032: liveness never dependency-aware, readiness may be.
      probes:
        enabled: true
      show-details: when-authorized
