server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # 6380, not the default 6379: infra/docker-compose.yml publishes Redis
      # there to avoid colliding with a local install. Left at the default the
      # health indicator reports DOWN and the readiness probe fails, so the
      # gateway never takes traffic - with nothing in the log explaining why.
      port: ${REDIS_PORT:6380}

  kafka:
    # auth.revocation (ADR-012). RevocationConsumer builds its own raw
    # KafkaConsumer from this bootstrap address rather than a
    # spring-kafka @KafkaListener container, so it can control the
    # partition-assign / seek-to-beginning / end-offset sequence needed to
    # know precisely when it has caught up - see RevocationConsumer.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  cloud:
    gateway:
      routes:
        # The routing table lives in YAML, not a Java DSL (see
        # wiki/projects/api-gateway.md): it ships as a ConfigMap per ADR-033
        # and can be retuned without a rebuild. Java owns filter BEHAVIOUR;
        # YAML owns which path goes where.
        #
        # login and register get their own routes, ahead of the general
        # auth-service catch-all below, purely so each can carry its own
        # RequestRateLimiter args - routes are matched in list order, first
        # match wins, so the more specific ones must come first.
        #
        # This limiter is IP-keyed (ipKeyResolver, RateLimitConfig) and
        # stays that way deliberately - it is the volumetric shield, not
        # the account-abuse control. It cannot see the request body
        # (Spring Cloud Gateway is a streaming WebFlux/Netty proxy;
        # buffering the body here to read a username would defeat the
        # whole point of a non-blocking gateway and open a
        # memory-exhaustion DoS surface). The tight, per-account defense
        # (5 failed attempts/min by username, then a DB-backed lockout
        # after 10) lives in auth-service's LoginService, where the body
        # has already been safely parsed - see that service's
        # application.yml (auth.login-security) and
        # wiki/projects/api-gateway.md.
        #
        # replenishRate/burstCapacity are per-second integers - Spring
        # Cloud Gateway's own constraint, not this project's choice. 60/min
        # only fits it cleanly because 60 is divisible by 60
        # (replenishRate: 1); a limit that wasn't a clean multiple of 60
        # couldn't be expressed exactly here and would need the same
        # custom-Lua approach this replaced.
        - id: auth-service-login
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/login
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
        # Register: same volumetric-only reasoning, no per-account layer
        # needed since there is no existing account to brute-force yet.
        # 20/min doesn't reduce to a whole replenishRate on its own
        # (20/60 = 0.333), so requestedTokens does the rest: each request
        # spends 3 tokens against a 1-token/sec refill, netting exactly
        # 1/3 request per second = 20/min. burstCapacity 60 = 20 requests'
        # worth of tokens, so an idle bucket still allows a burst of 20.
        - id: auth-service-register
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/register
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 3
                key-resolver: "#{@ipKeyResolver}"
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          # No rewrite filter, deliberately: auth-service serves the same
          # /api/v1 prefix it is reached by, so a path in a log means the same
          # thing on both sides of the gateway.

      httpclient:
        connect-timeout: 2000
        response-timeout: 10s

gateway:
  jwt:
    jwks-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: ${JWT_AUDIENCE:ticketmaster-api}

    # ADR-012 fixes this at 5 minutes and derives the rotation phase length
    # from it. Raising it silently lengthens the window in which a rotation can
    # strand this instance with a key set that no longer signs anything.
    refresh-interval: PT5M

    # Deliberately small. Skew tolerance is added directly to the life of every
    # expired token, so generosity here quietly extends the 10-minute window.
    clock-skew: PT30S

    unknown-kid-ttl: PT60S

    # The endpoints where credentials are exchanged cannot themselves require a
    # credential. Everything not listed here needs a valid token.
    public-paths:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /actuator/health

  revocation:
    topic: auth.revocation
    # Prefix only - RevocationConsumer appends a random suffix per JVM so
    # every instance gets its OWN consumer group (ADR-012) and always
    # replays the compacted topic from earliest on startup, rather than
    # resuming a previous instance's committed offset.
    consumer-group-prefix: api-gateway-revocation

    # An entry only matters while a token issued before revokeBefore could
    # still be alive. Must match (or exceed) auth-service's access-token
    # TTL (ADR-012: 10 min default) - the gateway does not currently read
    # that TTL from anywhere shared, so it is repeated here deliberately;
    # see the ambiguity note in the PR report.
    max-token-lifetime: PT10M
    sweep-interval: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # readiness only. Adding jwks/revocation to liveness would make
      # Kubernetes restart a gateway that is working perfectly and simply
      # cannot reach auth-service/Kafka - turning someone else's outage
      # into a crash loop of our own (ADR-032).
      #
      # revocation is a DELIBERATE fail-closed carve-out (ADR-012): unlike
      # every other readiness dependency in this project, which is
      # fail-open (degrade routing around it), an instance that cannot
      # confirm it has caught up on auth.revocation at startup must not
      # take traffic - serving JWT validation with an empty revocation map
      # would silently un-revoke every banned account. This is the ONE
      # named exception; do not "fix" it toward the fail-open default.
      group:
        readiness:
          include: readinessState,jwks,revocation
