server:
  port: 8084

spring:
  application:
    name: event-service

  datasource:
    # Same shared-coordinator/own-schema convention as auth-service and
    # user-service - see user-service's application.yml for the full
    # rationale (Flyway history collision if two services shared a schema).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ticketmaster}
    username: ${DB_USER:ticketmaster}
    password: ${DB_PASSWORD:ticketmaster}
    hikari:
      # Same HikariCP zero-retry gap fixed in auth-service/user-service
      # this session - applied here from day one rather than waiting to
      # hit the same crash-loop live.
      initialization-fail-timeout: 30000

  jpa:
    hibernate:
      # Flyway owns the schema (ADR-027); Hibernate only validates against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: event_service

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: event_service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_UI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # ADR-032: liveness never dependency-aware, readiness may be.
      probes:
        enabled: true
      show-details: when-authorized
