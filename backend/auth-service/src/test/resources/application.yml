# Test-only overrides.

grpc:
  server:
    # -1 disables the gRPC server entirely.
    #
    # The root build gives every module grpc-spring-boot-starter (ADR-023),
    # which binds 9090 on context startup. Each @SpringBootTest class boots
    # its own context, so the second one to start fails with
    # "Address already in use". Nothing in this module serves gRPC yet;
    # when it does, those tests should bind an ephemeral port rather than
    # re-enabling a fixed one here.
    port: -1

logging:
  level:
    # Testcontainers logs every container lifecycle event at INFO, which
    # buries real assertion failures in the report.
    org.testcontainers: WARN
    com.github.dockerjava: WARN
