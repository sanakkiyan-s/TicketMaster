server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    # Points at the Postgres coordinator directly, NOT PgBouncer (:6432).
    # ADR-024 puts PgBouncer in front of each Citus coordinator in
    # production; going direct locally keeps a startup failure readable as
    # one hop instead of two while there is nothing to pool yet. Revisit
    # when connection-pool behaviour is actually being exercised.
    # 5433 because infra/docker-compose.yml publishes the coordinator on
    # 5433:5432 - the container still listens on 5432 internally. The host
    # port was moved off 5432 to avoid colliding with a local Postgres install.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ticketmaster}
    username: ${DB_USER:ticketmaster}
    password: ${DB_PASSWORD:ticketmaster}

  jpa:
    hibernate:
      # Flyway owns the schema (ADR-027). Hibernate must never alter it —
      # `validate` fails fast on drift instead of silently "fixing" it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      # Same cluster/instance the gateway uses (ADR-004) - one shared
      # Redis, not a second one per service. 6380, not the default 6379:
      # see api-gateway's application.yml for why.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

auth:
  login-security:
    # The account-abuse control described in wiki/projects/api-gateway.md:
    # tight and username-keyed, sitting behind the gateway's loose
    # IP-keyed volumetric shield. Deliberately separate from that limiter
    # - a shared IP (NAT/corporate/library) must never cost a legitimate
    # user their own login budget, which is exactly what an IP-only limit
    # would do.
    #
    # Two-window Redis design (ADR-040), replacing a DB-persisted counter
    # that never decayed.
    fast-window-limit: 5
    fast-window-ttl: PT1M
    # Catches an attacker who paces guesses just under the fast window's
    # rate to avoid it - self-decaying via TTL, unlike the old
    # failed_login_attempts column, so a legitimate user's occasional
    # mistypes days apart no longer accumulate toward a lock forever.
    slow-window-limit: 15
    slow-window-ttl: PT24H
    lock-duration: PT15M


  jwt:
    # `iss` and `aud` are matched by the gateway, so they are configuration
    # rather than constants — the same build runs in every environment and must
    # not claim to be the production issuer while running locally.
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: ${JWT_AUDIENCE:ticketmaster-api}

    # ADR-012's starting default, marked there as "needs real data". Also the
    # floor for rotation phase 3 DRAIN: shortening it without adjusting the
    # rotation schedule leaves live tokens signed by an already-destroyed key.
    access-token-ttl: PT10M

    # `ephemeral` generates an in-memory key pair at startup: correct at one
    # instance, WRONG at two, since each replica would publish only its own key
    # and reject the other's tokens. ADR-010 requires Vault KV v2 for anything
    # shared; that provider does not exist yet, so production must not start
    # until it does.
    key-source: ${JWT_KEY_SOURCE:ephemeral}

    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      # Dev-mode root token from infra/docker-compose.yml. ADR-010 requires
      # AppRole with a response-wrapped secret_id in production, and the
      # Kubernetes auth method on k8s.
      token: ${VAULT_TOKEN:dev-root-token}
      backend: ${VAULT_KV_BACKEND:secret}
      path: ${VAULT_JWT_PATH:auth-service/jwt-keys}
      # Well under ADR-012's ~15 min phase-1 window, so every replica has seen
      # a newly published key long before anything signs with it.
      refresh-interval: PT60S
      # Lets a fresh local Vault work with no manual seeding. Never in
      # production: it means the service will mint its own signing key.
      bootstrap-if-empty: ${JWT_VAULT_BOOTSTRAP:false}

    rotation:
      # ADR-012's real production numbers. Tests override these to a few
      # milliseconds via @DynamicPropertySource rather than waiting on
      # real minutes - see RotationOrchestratorTest.
      publish-duration: PT15M
      drain-duration: PT30M
      # How often RotationScheduler checks whether the current phase's
      # minimum duration has elapsed. Well under publish-duration so a
      # phase does not run meaningfully longer than configured before the
      # scheduler notices.
      scheduler-interval: PT2M

  refresh-cookie:
    # Secure means the browser never sends it over plaintext HTTP. True by
    # default because getting this wrong exposes a 30-day credential on the
    # wire; overridable only because local dev has no TLS (Chrome treats
    # localhost as a secure context, so it works there anyway).
    secure: ${REFRESH_COOKIE_SECURE:true}

springdoc:
  api-docs:
    # Always on: this is what api-gateway aggregates and what CI diffs for
    # contract drift (ADR-034). It is an internal endpoint, not a public
    # one — see SecurityConfig.
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Human browsing surface. Off in production; there is no reason to
    # ship an interactive API explorer to the internet edge.
    enabled: ${SWAGGER_UI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # ADR-032 splits liveness (never dependency-aware) from readiness
      # (may be, fail-open by default). Enabling probes exposes both as
      # /actuator/health/liveness and /actuator/health/readiness.
      probes:
        enabled: true
      show-details: when-authorized
