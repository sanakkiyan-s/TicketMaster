server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    # Points at the Postgres coordinator directly, NOT PgBouncer (:6432).
    # ADR-024 puts PgBouncer in front of each Citus coordinator in
    # production; going direct locally keeps a startup failure readable as
    # one hop instead of two while there is nothing to pool yet. Revisit
    # when connection-pool behaviour is actually being exercised.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ticketmaster}
    username: ${DB_USER:ticketmaster}
    password: ${DB_PASSWORD:ticketmaster}

  jpa:
    hibernate:
      # Flyway owns the schema (ADR-027). Hibernate must never alter it —
      # `validate` fails fast on drift instead of silently "fixing" it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  jwt:
    # `iss` and `aud` are matched by the gateway, so they are configuration
    # rather than constants — the same build runs in every environment and must
    # not claim to be the production issuer while running locally.
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: ${JWT_AUDIENCE:ticketmaster-api}

    # ADR-012's starting default, marked there as "needs real data". Also the
    # floor for rotation phase 3 DRAIN: shortening it without adjusting the
    # rotation schedule leaves live tokens signed by an already-destroyed key.
    access-token-ttl: PT10M

    # `ephemeral` generates an in-memory key pair at startup: correct at one
    # instance, WRONG at two, since each replica would publish only its own key
    # and reject the other's tokens. ADR-010 requires Vault KV v2 for anything
    # shared; that provider does not exist yet, so production must not start
    # until it does.
    key-source: ${JWT_KEY_SOURCE:ephemeral}

  refresh-cookie:
    # Secure means the browser never sends it over plaintext HTTP. True by
    # default because getting this wrong exposes a 30-day credential on the
    # wire; overridable only because local dev has no TLS (Chrome treats
    # localhost as a secure context, so it works there anyway).
    secure: ${REFRESH_COOKIE_SECURE:true}

springdoc:
  api-docs:
    # Always on: this is what api-gateway aggregates and what CI diffs for
    # contract drift (ADR-034). It is an internal endpoint, not a public
    # one — see SecurityConfig.
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Human browsing surface. Off in production; there is no reason to
    # ship an interactive API explorer to the internet edge.
    enabled: ${SWAGGER_UI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # ADR-032 splits liveness (never dependency-aware) from readiness
      # (may be, fail-open by default). Enabling probes exposes both as
      # /actuator/health/liveness and /actuator/health/readiness.
      probes:
        enabled: true
      show-details: when-authorized
