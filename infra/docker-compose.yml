# Phase 0 platform bootstrap (ADR-036 / implementation-roadmap.md).
# No product code runs here yet — this is the infra every service
# depends on: Postgres/Citus, Redis, Kafka + Debezium + Schema Registry,
# Vault, MinIO (S3-compatible object storage, ADR-017).

services:

  # --- Postgres / Citus (ADR-005) ---------------------------------
  postgres-coordinator:
    image: citusdata/citus:12.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketmaster}
      POSTGRES_DB: ${POSTGRES_DB:-ticketmaster}
    ports:
      - "5432:5432"
    volumes:
      - pg_coordinator_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketmaster}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-worker-1:
    image: citusdata/citus:12.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketmaster}
      POSTGRES_DB: ${POSTGRES_DB:-ticketmaster}
    volumes:
      - pg_worker1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketmaster}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PgBouncer (ADR-024) — transaction-mode pooling in front of the coordinator
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ticketmaster}:${POSTGRES_PASSWORD:-ticketmaster}@postgres-coordinator:5432/${POSTGRES_DB:-ticketmaster}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:6432"
    depends_on:
      postgres-coordinator:
        condition: service_healthy

  # --- Redis Cluster (ADR-004) — single-node stand-in for local dev ---
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly no
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Kafka (KRaft mode, no Zookeeper) + Schema Registry (ADR-007) ---
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ticketmaster-local-kraft-cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8082:8081"
    depends_on:
      - kafka

  # Kafka Connect + Debezium (Transactional Outbox source, ADR-007)
  kafka-connect:
    image: debezium/connect:2.7.3.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: ticketmaster-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - schema-registry
      - postgres-coordinator

  # --- Vault (ADR-010) — dev mode, root token fixed for local convenience ---
  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

  # --- MinIO (S3-compatible object storage, ADR-017) ---
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ticketmaster}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ticketmaster123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_coordinator_data:
  pg_worker1_data:
  minio_data:
