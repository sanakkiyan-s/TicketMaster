apiVersion: 1

groups:
  - orgId: 1
    name: outbox
    folder: TicketMaster
    interval: 1m
    rules:
      - uid: outbox-stalled
        title: OutboxStalled
        condition: C
        for: 5m
        labels:
          severity: P2
        annotations:
          summary: "Debezium replication lag on {{ $labels.server }} outbox has exceeded 30s for 5+ minutes"
          description: >-
            The outbox/Debezium pipeline (currently: auth-service's
            auth_service_outbox_slot) is falling behind. Revoked
            sessions/tokens published to the outbox are not reaching
            Kafka in a timely way. See ADR-015's OutboxStalled definition
            and RevocationPublisher.java for what depends on this path.
          runbook_url: ""
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              expr: debezium_postgres_connector_metrics_millisecondsbehindsource{context="streaming"}
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: "-100"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    # -1 = Debezium idle (no events since connector
                    # (re)start), not lag - excluded by this threshold
                    # since it will always be < 30000 anyway. Real lag is
                    # a large positive millisecond count.
                    params: [30000]
                  operator:
                    type: and
                  query:
                    params: ["A"]
                  reducer:
                    type: last
                  type: query
