# Filesystem backend - see infra/tempo/tempo.yaml's header for why this
# skips MinIO/S3 at current scale.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Loki 3.x accepts OTLP log push natively at /otlp/v1/logs with no
  # further config - what the collector's otlphttp/loki exporter targets.
  allow_structured_metadata: true
